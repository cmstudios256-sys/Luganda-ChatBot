# Yogera — QLoRA that actually fits a free Colab / Kaggle T4 (16 GB, no bf16).
# Small model, short sequences, gradient accumulation instead of batch size.
# Expect: correct-looking Luganda with your store's voice, weaker grammar than
# Sunflower-14B. Use it to prove the loop and to serve cheaply, then move up.
base_model: Qwen/Qwen3-8B
output_dir: finetune/out/yogera-t4-8b-lora

data:
  train: out/train.jsonl
  val: out/val.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

training:
  epochs: 3
  batch_size: 1
  grad_accum: 16
  lr: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_seq_len: 1024
  train_on_responses_only: true
  bf16: false
  fp16: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  seed: 42

merge_and_export: true
merge_output_dir: finetune/out/yogera-t4-8b-merged

hub:
  push_to_hub: false
  repo_id: your-org/yogera-luganda-lora
  private: true
